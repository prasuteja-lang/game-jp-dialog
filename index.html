<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#123a7a">
  <title>Nihongo Adventure</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Font dimuat tanpa memblokir tampilan: jika Google Fonts lambat/tidak terjangkau, game tetap tampil -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Noto+Sans+JP:wght@400;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Noto+Sans+JP:wght@400;700&display=swap"></noscript>

  <link rel="stylesheet" href="Style.css?v=5">
<base target="_blank">
<base target="_blank">
</head>
<body>

  <main id="stage" class="stage is-menu">
    <!-- Background (dua lapisan agar bisa crossfade) -->
    <img id="bg-a" class="bg" alt="">
    <img id="bg-b" class="bg" alt="">

    <!-- Karakter -->
    <img id="char-image" alt="">
    <div id="shade"></div>

    <!-- Label bab (kiri atas) & tombol HUD (kanan atas) -->
    <div id="chapter" class="chapter"></div>
    <div class="hud">
      <button id="vocab-btn" class="hud-btn" type="button" aria-label="Kosakata dan penjelasan"></button>
      <button id="mute-btn" class="hud-btn" type="button" aria-label="Matikan suara"></button>
      <button id="settings-btn" class="hud-btn" type="button" aria-label="Pengaturan"></button>
    </div>

    <!-- Pilihan jawaban + kotak dialog -->
    <div id="ui">
      <div id="choices-box" class="choices"></div>

      <div id="dialog-box">
        <div id="speaker-name"></div>
        <button id="speak-btn" type="button" aria-label="Putar ulang suara" hidden></button>
        <p id="dialog-text" lang="ja"></p>
        <p id="dialog-trans" class="dialog-trans"></p>
        <div class="dialog-foot">
          <button id="next-btn" class="next-btn" type="button">Lanjutkan</button>
        </div>
      </div>
    </div>

    <!-- Kartu ending -->
    <section id="ending" class="ending is-hidden">
      <div id="ending-card" class="ending-card is-good">
        <div id="ending-icon" class="ending-icon"></div>
        <h2 id="ending-title" class="ending-title" lang="ja"></h2>
        <span id="ending-badge" class="ending-badge"></span>
        <p id="ending-desc" class="ending-desc"></p>
        <div id="ending-actions" class="ending-actions"></div>
      </div>
    </section>

    <!-- Layar judul -->
    <section id="title" class="title is-hidden">
      <!-- Kelopak sakura berjatuhan (dekorasi layar judul) -->
      <div class="petals" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
      </div>

      <div class="title-pick">
        <p id="pick-label" class="pick-label">Pilih Karakter</p>
        <div class="pick-row">
          <button class="pick-card" type="button" data-player="girl" aria-pressed="false">
            <span class="pick-name" lang="ja"></span>
            <img id="title-girl" alt="">
          </button>
          <button class="pick-card" type="button" data-player="boy" aria-pressed="false">
            <span class="pick-name" lang="ja"></span>
            <img id="title-boy" alt="">
          </button>
        </div>
      </div>
      <div class="title-main">
        <h1 class="logo">
          <span class="logo-en">Nihongo <br>Adventure</span>
          <span class="logo-sakura" aria-hidden="true">🌸</span>
        </h1>
        <p class="logo-jp" lang="ja">by <ruby>漢字<rt>かんじ</rt></ruby><ruby>大好<rt>だいす</rt></ruby>き</p>
        <p class="tagline">Belajar bahasa Jepang melalui interaktif cerita, setiap pilihan adalah ending mu. </p>
        <div class="title-actions">
          <button id="btn-start" class="t-btn t-primary" type="button">Mulai</button>
          <button id="btn-continue" class="t-btn t-primary" type="button" hidden>Lanjutkan</button>
          <button id="btn-settings" class="t-btn" type="button">Pengaturan</button>
          <button id="btn-about" class="t-btn" type="button">Tentang</button>
        </div>
        <p class="title-foot" lang="ja"><ruby>一緒<rt>いっしょ</rt></ruby>にがんばりましょう！<span>Mari belajar bersama!</span></p>
      </div>
    </section>

    <!-- Layar pilih tema -->
    <section id="themes" class="themes is-hidden">
      <div class="themes-head">
        <button id="themes-back" class="back-btn" type="button">‹ Kembali</button>
        <h2 class="themes-title">Pilih Tema</h2>
        <p class="themes-sub">Setiap tema punya cerita dan musik latarnya sendiri.</p>
      </div>
      <div id="themes-grid" class="themes-grid"></div>
    </section>

    <!-- Jendela (kosakata, pengaturan, tentang) -->
    <div id="modal" class="modal is-hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-card">
        <header class="modal-head">
          <h2 id="modal-title"></h2>
          <button id="modal-close" class="modal-close" type="button" aria-label="Tutup">✕</button>
        </header>
        <nav id="modal-tabs" class="tabs" role="tablist" hidden></nav>
        <div id="modal-body" class="modal-body"></div>
        <footer id="modal-foot" class="modal-foot"></footer>
      </div>
    </div>

    <!-- Layar memuat / error -->
    <div id="overlay" class="overlay is-loading">
      <div class="overlay-card">
        <div class="spinner" aria-hidden="true"></div>
        <p id="ov-msg" class="ov-msg">Memuat cerita…</p>
        <div id="ov-actions" class="ov-actions"></div>
      </div>
    </div>
  </main>

  <!-- Diagnostik: tampilkan penyebab di layar jika game macet / ada error -->
  <script>
    (function () {
      var errors = [];
      function overlayEl() { return document.getElementById("overlay"); }
      function show(msg) {
        var o = overlayEl(), m = document.getElementById("ov-msg"), a = document.getElementById("ov-actions");
        if (!o || !m || o.classList.contains("is-hidden")) return;
        o.classList.remove("is-loading");
        m.textContent = msg;
        if (a && !a.children.length) {
          var b = document.createElement("button");
          b.type = "button"; b.className = "t-btn t-primary"; b.textContent = "Muat ulang";
          b.onclick = function () { location.reload(); };
          a.appendChild(b);
        }
      }
      window.addEventListener("error", function (e) {
        var t = e.target;
        if (t && t !== window) {
          // Hanya Script.js dan Style.css yang kritis; font dan kamus furigana boleh gagal tanpa menghentikan game
          if (t.tagName === "SCRIPT" && /Script\.js/.test(t.src)) errors.push("File gagal dimuat: " + t.src);
          else if (t.tagName === "LINK" && /Style\.css/.test(t.href)) errors.push("File gagal dimuat: " + t.href);
          else return;
        } else {
          errors.push((e.message || "Error tidak dikenal") + (e.lineno ? " (baris " + e.lineno + ")" : ""));
        }
        show("Terjadi masalah: " + errors.join(" | "));
      }, true);
      window.addEventListener("unhandledrejection", function (e) {
        var r = e.reason;
        errors.push("Error: " + (r && r.message ? r.message : String(r)));
        show("Terjadi masalah: " + errors.join(" | "));
      });
      setTimeout(function () {
        var o = overlayEl();
        if (!o || o.classList.contains("is-hidden") || !o.classList.contains("is-loading")) return;
        if (!window.__nihongoStarted) {
          show("Script.js tidak berjalan (tidak termuat atau error). " + (errors.join(" | ") || "Periksa apakah file Script.js ada di GitHub dan namanya sama persis."));
        } else {
          show("Masih memuat setelah 25 detik. Tahap terakhir: " + (window.__nihongoStep || "?") + ". Coba muat ulang.");
        }
      }, 25000);
    })();
  </script>

  <noscript>Game ini membutuhkan JavaScript agar bisa berjalan.</noscript>
  <script src="Script.js?v=voices-all-themes-20261020"></script>
</body>
</html>
